# XcodeGen spec — generates BrainRec.xcodeproj so you can Archive and upload to the App Store.
#   brew install xcodegen
#   xcodegen generate
#   open BrainRec.xcodeproj
# Then in Xcode: target BrainRec → Signing & Capabilities → pick your Team. That is the only manual step.
name: BrainRec

options:
  bundleIdPrefix: com.letscodebrain
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"          # version shown in the App Store (bump for every release)
    CURRENT_PROJECT_VERSION: "1"      # build number (must be higher for every upload)
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM: ABCDE12345    # optional: your Team ID, or pick the team in Xcode instead

targets:
  BrainRec:
    type: application
    platform: macOS
    sources:
      - path: Sources/BrainRec
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: BrainRec
        PRODUCT_BUNDLE_IDENTIFIER: com.letscodebrain.brainrec
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/BrainRec-AppStore.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
